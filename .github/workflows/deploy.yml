name: Deploy

# 正式站部署規則
# - push 到 main：依根目錄 DEPLOY_TARGET 檔案決定部署哪一版（legacy＝舊站 legacy-site/；site＝新站 dist/）。
#   合併任何 PR 都不會把新站推上正式站，除非同一個 commit 把 DEPLOY_TARGET 改成 site。
# - 手動 Run workflow：以輸入的 target 為準（回復舊站或臨時上架都可以）。

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'site：部署新站（dist/）；legacy：部署舊站（legacy-site/）'
        type: choice
        options:
          - legacy
          - site
        default: legacy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - id: target
        name: 決定部署目標
        env:
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            t="$DISPATCH_TARGET"
          else
            t="$(tr -d '[:space:]' < DEPLOY_TARGET 2>/dev/null || true)"
          fi
          case "$t" in site|legacy) ;; *) t=legacy ;; esac
          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "部署目標：$t" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - if: steps.target.outputs.target == 'site'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.target.outputs.target == 'site'
        run: npm ci

      - if: steps.target.outputs.target == 'site'
        run: npm run build

      - if: steps.target.outputs.target == 'site'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 舊站：直接部署 legacy-site/（內含 CNAME）
      - if: steps.target.outputs.target == 'legacy'
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
