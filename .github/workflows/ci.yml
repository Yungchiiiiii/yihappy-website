name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 只裝與 package.json 版本相符的 Chromium（runner 已有系統相依套件）
      - run: npx playwright install chromium

      # check:fonts → test:build → test:links → test:html → test:a11y
      - run: npm test

      - run: npm run test:screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: qa/screenshots
          if-no-files-found: ignore
